name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out theme
        uses: actions/checkout@v5

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Check palette, contrast and assets
        run: python3 scripts/check-theme.py .

      - name: Syntax-check shell scripts
        run: bash -n scripts/*.sh

      - name: Render lock art
        run: |
          tmp=$(mktemp -d)
          cp -a . "$tmp/theme"
          ./scripts/make-unlock.sh "$tmp/theme" "$tmp/unlock.png" "$tmp/preview-unlock.png"
          identify "$tmp/unlock.png" "$tmp/preview-unlock.png"
